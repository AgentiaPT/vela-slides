name: Dependency Sweep

# Weekly supply-chain reconnaissance. Runs the deterministic half of a
# dependency bump and publishes the report — it never edits a manifest, opens a
# PR, or takes an upgrade. Deciding what to actually bump needs judgement the
# script deliberately does not attempt (see the `dependency-sweep` skill), so
# this job exists to put a current, trustworthy report in front of whoever does.
#
# Scheduled the morning after Dependabot's Monday run, so the report reflects
# whatever the bot just opened.

on:
  schedule:
    - cron: "0 7 * * 2"   # Tuesdays 07:00 UTC
  workflow_dispatch:

# Read-only: this workflow publishes information, so it needs no write scope.
permissions:
  contents: read

concurrency:
  group: dep-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Sweep dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked npm tree
        # `npm audit` reports on an installed tree, so the audit half of the
        # sweep is meaningless without this. --ignore-scripts per repo policy.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the sweep
        id: sweep
        # Findings are the PRODUCT of this job, not a failure, so the exit code
        # is captured rather than allowed to end the step. `run:` executes under
        # `bash -e`, which would abort before the capture — hence `set +e`.
        # One invocation emits both formats so the registry is queried once.
        run: |
          set +e
          python3 tools/vela-dev/scripts/dep-sweep.py \
            --vet --upgrades --out sweep-report.md --json-out sweep-report.json
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "dep-sweep exited $code (0=clean, 1=findings, 4=verification FAILED)"

      - name: Publish to job summary
        if: always()
        run: cat sweep-report.md >> "$GITHUB_STEP_SUMMARY" || echo "sweep produced no report" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-sweep-report
          path: |
            sweep-report.md
            sweep-report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Fail only on a verification failure
        # Exit 4 means a pin no longer matches its upstream tag, or the two
        # lockfiles disagree. That is not "there are updates available" — it is
        # a broken invariant, and it should page someone.
        if: steps.sweep.outputs.exit == '4'
        run: |
          echo "::error::dep-sweep reported a FAILED verification (bad Action pin or lockfile parity break)."
          exit 1
